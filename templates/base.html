<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  
  <!-- Romantic Google Fonts (Great Vibes & Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Pure CSS Stylesheet (Strict Blue Theme, Zero JS) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Atmospheric Background: Corner Moon, Stars, Clouds, Floating Hearts, Flowers & Butterflies -->
  <div class="sky-ambiance" aria-hidden="true">
    <!-- Glowing moon in the corner -->
    <img src="{{ url_for('static', filename='images/moon.svg') }}" class="corner-moon" alt="">

    <!-- Twinkling stars -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    
    <!-- Floating soft clouds -->
    <div class="floating-cloud cloud-1"></div>
    <div class="floating-cloud cloud-2"></div>
    
    <!-- Floating gentle blue hearts -->
    <div class="floating-heart heart-1">♡</div>
    <div class="floating-heart heart-2">♡</div>
    <div class="floating-heart heart-3">♡</div>
    <div class="floating-heart heart-4">♡</div>

    <!-- Floating blue butterflies -->
    <img src="{{ url_for('static', filename='images/butterfly.svg') }}" class="ambient-butterfly butterfly-a" alt="">
    <img src="{{ url_for('static', filename='images/butterfly.svg') }}" class="ambient-butterfly butterfly-b" alt="">

    <!-- Glowing blue flowers in the bottom corners -->
    <img src="{{ url_for('static', filename='images/blue_roses.svg') }}" class="corner-flowers flowers-left" alt="">
    <img src="{{ url_for('static', filename='images/blue_roses.svg') }}" class="corner-flowers flowers-right" alt="">
  </div>

  <!-- Page Content Container -->
  <main class="main-wrapper">
    {% block content %}{% endblock %}
  </main>

  <!-- Blue Romantic Footer -->
  <footer class="site-footer">
    <p>Crafted with patience, honesty & heartfelt care <span>♡</span> {{ partner_name }} &bull; {{ year }}</p>
  </footer>

</body>
</html>
