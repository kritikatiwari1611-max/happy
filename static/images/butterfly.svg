<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF3FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#87CEFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#246BCE" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDF3FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#87CEFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#246BCE" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="wingGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Upper Wing -->
  <path d="M 80 60 C 50 10, 10 25, 15 65 C 18 90, 55 90, 80 75 Z" 
        fill="url(#wingGrad1)" filter="url(#wingGlow)" stroke="#DDF3FF" stroke-width="1.2"/>
  <!-- Left Lower Wing -->
  <path d="M 80 75 C 45 80, 25 105, 45 125 C 65 135, 78 100, 80 85 Z" 
        fill="url(#wingGrad1)" opacity="0.85" stroke="#DDF3FF" stroke-width="1"/>

  <!-- Right Upper Wing -->
  <path d="M 80 60 C 110 10, 150 25, 145 65 C 142 90, 105 90, 80 75 Z" 
        fill="url(#wingGrad2)" filter="url(#wingGlow)" stroke="#DDF3FF" stroke-width="1.2"/>
  <!-- Right Lower Wing -->
  <path d="M 80 75 C 115 80, 135 105, 115 125 C 95 135, 82 100, 80 85 Z" 
        fill="url(#wingGrad2)" opacity="0.85" stroke="#DDF3FF" stroke-width="1"/>

  <!-- Wing delicate patterns / veins -->
  <path d="M 80 62 Q 50 40 35 50 M 80 68 Q 45 65 30 75" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" fill="none"/>
  <path d="M 80 62 Q 110 40 125 50 M 80 68 Q 115 65 130 75" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" fill="none"/>

  <!-- Butterfly Body -->
  <ellipse cx="80" cy="74" rx="3.5" ry="22" fill="#071B3A"/>
  <!-- Head -->
  <circle cx="80" cy="50" r="4.5" fill="#0B2D55"/>
  <!-- Antennae -->
  <path d="M 80 48 Q 72 32 64 34" stroke="#87CEFA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="63" cy="34" r="1.5" fill="#DDF3FF"/>
  <path d="M 80 48 Q 88 32 96 34" stroke="#87CEFA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="97" cy="34" r="1.5" fill="#DDF3FF"/>

  <!-- Sparkles on wings -->
  <circle cx="45" cy="45" r="2.5" fill="#FFFFFF"/>
  <circle cx="115" cy="45" r="2.5" fill="#FFFFFF"/>
</svg>
