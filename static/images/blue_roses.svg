<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <radialGradient id="roseCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DDF3FF"/>
      <stop offset="40%" stop-color="#87CEFA"/>
      <stop offset="80%" stop-color="#246BCE"/>
      <stop offset="100%" stop-color="#0B2D55"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEFA"/>
      <stop offset="60%" stop-color="#1A4A85"/>
      <stop offset="100%" stop-color="#071B3A"/>
    </radialGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Foliage / Leaves -->
  <path d="M 50 110 Q 30 70 80 85 Q 70 120 50 110 Z" fill="url(#leafGrad)"/>
  <path d="M 190 110 Q 210 70 160 85 Q 170 120 190 110 Z" fill="url(#leafGrad)"/>
  <path d="M 120 140 Q 120 170 100 160 Q 100 135 120 140 Z" fill="url(#leafGrad)"/>
  <path d="M 120 140 Q 140 170 150 155 Q 135 135 120 140 Z" fill="url(#leafGrad)"/>

  <!-- Left Rose -->
  <g transform="translate(45, 60) scale(0.65)" filter="url(#roseGlow)">
    <circle cx="50" cy="50" r="42" fill="#0B2D55"/>
    <path d="M 20 50 Q 50 15 80 50 Q 70 85 20 50 Z" fill="url(#roseCore)"/>
    <path d="M 30 65 Q 50 90 70 65 Q 75 40 30 65 Z" fill="#246BCE"/>
    <path d="M 40 45 Q 50 30 60 45 Q 65 60 40 45 Z" fill="#87CEFA"/>
    <circle cx="50" cy="50" r="10" fill="#DDF3FF"/>
  </g>

  <!-- Right Rose -->
  <g transform="translate(130, 60) scale(0.65)" filter="url(#roseGlow)">
    <circle cx="50" cy="50" r="42" fill="#0B2D55"/>
    <path d="M 20 50 Q 50 15 80 50 Q 70 85 20 50 Z" fill="url(#roseCore)"/>
    <path d="M 30 65 Q 50 90 70 65 Q 75 40 30 65 Z" fill="#246BCE"/>
    <path d="M 40 45 Q 50 30 60 45 Q 65 60 40 45 Z" fill="#87CEFA"/>
    <circle cx="50" cy="50" r="10" fill="#DDF3FF"/>
  </g>

  <!-- Center Main Rose -->
  <g transform="translate(75, 20) scale(0.9)" filter="url(#roseGlow)">
    <circle cx="50" cy="50" r="46" fill="#0B2D55"/>
    <path d="M 12 50 Q 50 10 88 50 Q 75 92 12 50 Z" fill="url(#roseCore)"/>
    <path d="M 22 68 Q 50 96 78 68 Q 82 36 22 68 Z" fill="#246BCE"/>
    <path d="M 32 42 Q 50 25 68 42 Q 72 65 32 42 Z" fill="#87CEFA"/>
    <path d="M 40 54 Q 50 42 60 54 Q 58 68 40 54 Z" fill="#DDF3FF"/>
    <circle cx="50" cy="52" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Dew drops / Sparkles -->
  <circle cx="115" cy="55" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="132" cy="72" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="85" cy="85" r="2" fill="#FFFFFF" opacity="0.8"/>
</svg>
