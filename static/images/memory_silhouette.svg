<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="skyCircle" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#DDF3FF"/>
      <stop offset="35%" stop-color="#87CEFA"/>
      <stop offset="70%" stop-color="#246BCE"/>
      <stop offset="100%" stop-color="#071B3A"/>
    </radialGradient>
    <filter id="softMemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background sky -->
  <circle cx="160" cy="160" r="145" fill="url(#skyCircle)"/>

  <!-- Crescent Moon in memory background -->
  <path d="M 230 70 A 35 35 0 1 0 250 120 A 30 30 0 1 1 230 70 Z" fill="#FFFFFF" opacity="0.9" filter="url(#softMemGlow)"/>

  <!-- Twinkling Stars -->
  <circle cx="90" cy="80" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="120" cy="60" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="65" cy="120" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="210" cy="135" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="180" cy="85" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="100,105 102,110 107,112 102,114 100,119 98,114 93,112 98,110" fill="#FFFFFF"/>

  <!-- Gentle hill silhouette -->
  <path d="M 15 250 Q 160 215 305 250 L 305 305 L 15 305 Z" fill="#071B3A"/>

  <!-- Romantic Couple Silhouette sitting together gazing at stars -->
  <!-- Him -->
  <circle cx="142" cy="176" r="13" fill="#071B3A"/>
  <path d="M 132 189 C 130 200, 126 230, 126 238 L 158 238 C 158 226, 154 195, 150 189 Z" fill="#071B3A"/>
  
  <!-- Her (leaning gently on his shoulder) -->
  <circle cx="166" cy="182" r="12" fill="#071B3A"/>
  <!-- Her hair flow -->
  <path d="M 160 176 C 172 170, 182 176, 180 192 C 178 206, 172 215, 170 225 C 166 215, 164 195, 160 186 Z" fill="#071B3A"/>
  <path d="M 152 194 C 152 205, 156 226, 158 238 L 186 238 C 186 230, 180 202, 174 194 Z" fill="#071B3A"/>

  <!-- Small glowing blue heart floating above them -->
  <path d="M 154 148 C 146 136, 138 144, 154 158 C 170 144, 162 136, 154 148 Z" fill="#DDF3FF" filter="url(#softMemGlow)"/>
</svg>
