<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDF3FF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#87CEFA" stop-opacity="0.8"/>
      <stop offset="90%" stop-color="#246BCE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#071B3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Aura -->
  <circle cx="100" cy="100" r="90" fill="url(#moonGlow)"/>
  <!-- Crescent Moon -->
  <path d="M 115 35 A 65 65 0 1 0 155 135 A 55 55 0 1 1 115 35 Z" fill="#DDF3FF" filter="url(#softGlow)"/>
  <!-- Moon details/craters in soft blue -->
  <circle cx="95" cy="85" r="9" fill="#87CEFA" opacity="0.35"/>
  <circle cx="85" cy="115" r="14" fill="#87CEFA" opacity="0.3"/>
  <circle cx="115" cy="130" r="7" fill="#87CEFA" opacity="0.25"/>
  <!-- Tiny sparkles -->
  <polygon points="145,50 148,58 156,61 148,64 145,72 142,64 134,61 142,58" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="65,45 67,50 72,52 67,54 65,59 63,54 58,52 63,50" fill="#DDF3FF" opacity="0.8"/>
</svg>
